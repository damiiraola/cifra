name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck y tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # npm 11 acepta los package-lock que genera Dependabot; el npm 10 de Node 22
      # los rechaza ("Missing: lru-cache@… from lock file").
      - name: npm 11
        run: npm install --global npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Same build Vercel does, without database (PGLite) — catches build-only
      # breakage (imports, Nitro/Vercel output) before merging.
      - name: Build
        run: node scripts/with-app-env.mjs npx vite build
        env:
          VITE_AUTH_ENABLED: "true"
